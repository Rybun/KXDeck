services:
  kxdeck:
    build: .
    image: ghcr.io/rybun/kxdeck:latest
    container_name: kxdeck
    ports:
      - "5000:5000"
    volumes:
      - ./render_cache:/app/render_cache
      - ./data:/app/data
    environment:
      # URL de KX-Bridge (Moonraker), obligatoria -- p.ej. http://192.168.1.50:7125
      KX_URL: ${KX_URL}
      # Opcional: si se deja vacia, KXDeck usa/genera una por defecto.
      API_KEY: ${API_KEY:-}
      # Opcional: dominios (coma-separados) desde los que se rechaza CUALQUIER
      # peticion, p.ej. si en algun momento se expuso KXDeck publicamente por
      # un dominio que ya no se quiere mantener.
      BLOCKED_HOSTS: ${BLOCKED_HOSTS:-}
      LISTEN_PORT: "5000"
      TZ: ${TZ:-Europe/Madrid}
      DEBUG_REQUESTS: ${DEBUG_REQUESTS:-0}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
